name: R3C Phase 1 Migration CI

on:
  pull_request:
    branches: [dev]
    paths:
      - 'docs/05_database/migrations/**'
      - 'docs/09_delivery/task6c_r3c_phase1_migration_plan.md'
      - 'backend/tests/test_r3c_phase1_**'
      - '.github/scripts/r3c_phase1_migration_ci.sh'
      - '.github/workflows/r3c-phase1-migration-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-postgresql-18:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: webcv_ci
          POSTGRES_PASSWORD: webcv-ci-only
          POSTGRES_DB: webcv_task_r3c_phase1_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U webcv_ci -d webcv_task_r3c_phase1_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      TEST_DATABASE_NAME: webcv_task_r3c_phase1_ci
      DATABASE_URL: postgresql+asyncpg://webcv_ci:webcv-ci-only@127.0.0.1:55432/webcv_task_r3c_phase1_ci
      R3C_PHASE1_DATABASE_URL: postgresql+asyncpg://webcv_ci:webcv-ci-only@127.0.0.1:55432/webcv_task_r3c_phase1_ci
      R3C_DATABASE_NAME: webcv_task_r3c_phase1_ci
      R3C_DATABASE_HOST: 127.0.0.1
      R3C_DATABASE_PORT: '55432'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev,queue]"

      - name: Run isolated migration and mismatch scenarios
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: bash .github/scripts/r3c_phase1_migration_ci.sh

      - name: Verify legacy CAS through current backend implementation
        working-directory: backend
        env:
          R3C_PHASE1_MIGRATION_QA: '1'
        run: python -m pytest -q tests/test_r3c_phase1_migration_postgres.py

      - name: Remove migration fixtures before regression
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec "${POSTGRES_CONTAINER_ID}" psql \
            -X -U webcv_ci -d webcv_task_r3c_phase1_ci -v ON_ERROR_STOP=1 \
            -c "DELETE FROM users WHERE id IN ('10000000-0000-0000-0000-000000000001','10000000-0000-0000-0000-000000000002')"

      - name: Run backend regression on migrated schema
        working-directory: backend
        env:
          R3C_PHASE1_MIGRATION_QA: '0'
        run: |
          python -m pytest -q \
            -k 'not test_celery_imports_do_not_create_engine_before_child_runtime'
          env -u TEST_DATABASE_NAME python -m pytest -q \
            tests/test_celery_tasks.py::test_celery_imports_do_not_create_engine_before_child_runtime

      - name: Run Ruff lint
        working-directory: backend
        run: python -m ruff check .

      - name: Check Ruff formatting
        working-directory: backend
        run: python -m ruff format --check .

      - name: Run mypy
        working-directory: backend
        run: python -m mypy app
