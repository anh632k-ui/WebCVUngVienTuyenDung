name: Validate PTTK

on:
  push:
    branches:
      - pttk-sync-v2
    paths:
      - 'docs/**'
      - '.github/workflows/pttk-validate.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/pttk-validate.yml'

jobs:
  validate-pttk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OpenAPI validators
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml openapi-spec-validator

      - name: Validate OpenAPI YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          from openapi_spec_validator import validate_spec

          path = Path('docs/07_api/openapi.yaml')
          with path.open('r', encoding='utf-8') as f:
              spec = yaml.safe_load(f)
          validate_spec(spec)
          print('OpenAPI validation: OK')
          PY

      - name: Install PlantUML
        run: |
          sudo apt-get update
          sudo apt-get install -y plantuml

      - name: Validate PlantUML syntax
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find docs -type f -name '*.puml' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'No PlantUML files found'
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "Checking $file"
            plantuml -checkonly "$file"
          done
          echo "PlantUML validation: OK (${#files[@]} files)"

      - name: Static schema sanity check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          sql = Path('docs/05_database/schema.sql').read_text(encoding='utf-8')
          tables = re.findall(r'(?im)^CREATE TABLE\s+([a-z_][a-z0-9_]*)\s*\(', sql)
          expected = {
              'users', 'skills', 'resumes', 'candidate_profiles',
              'resume_skills', 'resume_experiences', 'resume_educations',
              'job_descriptions', 'job_skills', 'match_results'
          }
          assert set(tables) == expected, (tables, expected)
          assert 'vector(1024)' in sql
          assert 'vector_cosine_ops' in sql
          assert "status IN ('PENDING', 'PROCESSING', 'COMPLETED', 'FAILED')" in sql
          print('Schema static sanity: OK')
          PY
