name: Backend CI

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [dev, main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: webcv_ci
          POSTGRES_PASSWORD: webcv-ci-only
          POSTGRES_DB: webcv_ungvien
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webcv_ci -d webcv_ungvien"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://webcv_ci:webcv-ci-only@127.0.0.1:5432/webcv_ungvien
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: python -m pip install -e ".[dev,queue]"

      - name: Initialize canonical schema and taxonomy in the CI database
        run: |
          docker exec -i "${{ job.services.postgres.id }}" \
            psql -U webcv_ci -d webcv_ungvien -v ON_ERROR_STOP=1 \
            < ../docs/05_database/schema.sql
          docker exec -i "${{ job.services.postgres.id }}" \
            psql -U webcv_ci -d webcv_ungvien -v ON_ERROR_STOP=1 \
            < ../docs/05_database/skill_taxonomy_seed.sql

      - name: Run tests
        run: python -m pytest -q

      - name: Run Ruff lint
        run: python -m ruff check .

      - name: Check Ruff formatting
        run: python -m ruff format --check .

      - name: Run mypy
        run: python -m mypy app
