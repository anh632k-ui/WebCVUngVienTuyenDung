name: R3C Phase 4A Heartbeat Constraints CI

on:
  pull_request:
    branches: [dev]
    paths:
      - 'backend/app/core/processing_fencing.py'
      - 'backend/tests/test_processing_fencing.py'
      - 'backend/tests/test_processing_heartbeat_postgres.py'
      - 'backend/tests/test_processing_ownership_constraints_postgres.py'
      - 'docs/09_delivery/task6c_r3c_phase4a_heartbeat_constraints_plan.md'
      - '.github/workflows/r3c-phase4a-heartbeat-constraints-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-heartbeat-and-constraints:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: r3c_phase4a_ci
          POSTGRES_PASSWORD: r3c-phase4a-ci-only
          POSTGRES_DB: r3c_phase4a_heartbeat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U r3c_phase4a_ci -d r3c_phase4a_heartbeat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      R3C_PHASE4A_POSTGRES_INTEGRATION: 'true'
      R3C_PHASE4A_DATABASE_URL: >-
        postgresql+asyncpg://r3c_phase4a_ci:r3c-phase4a-ci-only@127.0.0.1:5432/r3c_phase4a_heartbeat
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Initialize canonical schema
        run: |
          docker exec -i "${{ job.services.postgres.id }}" \
            psql -U r3c_phase4a_ci -d r3c_phase4a_heartbeat -v ON_ERROR_STOP=1 \
            < ../docs/05_database/schema.sql

      - name: Run Phase 4A unit and PostgreSQL tests without skips
        run: >-
          python -m pytest -q -rs
          tests/test_processing_fencing.py
          tests/test_processing_heartbeat_postgres.py
          tests/test_processing_ownership_constraints_postgres.py

      - name: Run Ruff lint for Phase 4A artifacts
        run: >-
          python -m ruff check
          app/core/processing_fencing.py
          tests/test_processing_fencing.py
          tests/test_processing_heartbeat_postgres.py
          tests/test_processing_ownership_constraints_postgres.py

      - name: Check Ruff formatting for Phase 4A artifacts
        run: >-
          python -m ruff format --check
          app/core/processing_fencing.py
          tests/test_processing_fencing.py
          tests/test_processing_heartbeat_postgres.py
          tests/test_processing_ownership_constraints_postgres.py

      - name: Run mypy for backend application
        run: python -m mypy app
