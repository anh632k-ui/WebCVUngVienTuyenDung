openapi: 3.0.3
info:
  title: WebCV Ung Vien Tuyen Dung API
  version: 1.4.0
  description: MVP API sau reliability/CAS/fingerprinted-idempotency lock. Parse create endpoints dùng Idempotency-Key, SHA-256 request fingerprint và internal recovery.
servers:
  - url: http://localhost:8000/api/v1

security:
  - BearerAuth: []

tags:
  - name: Authentication
  - name: Users
  - name: Admin
  - name: Skills
  - name: Resumes
  - name: Jobs
  - name: Matching

paths:
  /auth/register:
    post:
      tags: [Authentication]
      security: []
      summary: Đăng ký Candidate hoặc HR
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/UserResponse'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /auth/login:
    post:
      tags: [Authentication]
      security: []
      summary: Đăng nhập và nhận Access Token
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {description: Logged in, content: {application/json: {schema: {$ref: '#/components/schemas/LoginResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /auth/change-password:
    put:
      tags: [Authentication]
      summary: Đổi mật khẩu
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangePasswordRequest'}
      responses:
        '200': {description: Changed, content: {application/json: {schema: {$ref: '#/components/schemas/MessageResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /users/me:
    get:
      tags: [Users]
      summary: Lấy profile hiện tại
      responses:
        '200': {description: User, content: {application/json: {schema: {$ref: '#/components/schemas/UserResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    put:
      tags: [Users]
      summary: Cập nhật profile hiện tại
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserUpdateRequest'}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/UserResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /admin/users:
    get:
      tags: [Admin]
      summary: Danh sách user
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Limit20'}
        - {name: role, in: query, schema: {$ref: '#/components/schemas/Role'}}
        - {name: is_active, in: query, schema: {type: boolean}}
        - {name: keyword, in: query, schema: {type: string}}
      responses:
        '200': {description: Users, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedUsersResponse'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}

  /admin/users/{id}:
    patch:
      tags: [Admin]
      summary: Khóa/mở khóa hoặc đổi role
      description: Đổi Candidate/HR bị 409 nếu target còn Resume/JD chưa soft-delete.
      parameters:
        - {$ref: '#/components/parameters/UuidId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminUserPatchRequest'}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/UserResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /skills:
    get:
      tags: [Skills]
      summary: Tra cứu Skill Taxonomy
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Limit20'}
        - {name: keyword, in: query, schema: {type: string}}
        - {name: skill_kind, in: query, schema: {type: string, enum: [HARD, SOFT]}}
        - {name: category, in: query, schema: {type: string}}
      responses:
        '200': {description: Skills, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedSkillsResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /resumes/upload:
    post:
      tags: [Resumes]
      summary: Upload CV idempotently
      description: Fixed UUIDv5 namespace + SHA-256 raw file fingerprint. Same key/same fingerprint returns same Resume; same key/different fingerprint returns 409 IDEMPOTENCY_KEY_REUSED. Storage orphan is reused only after SHA-256 verification. Persist trước dispatch; dispatcher lỗi để Resume PENDING cho internal recovery.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '202': {description: Persisted/accepted; same key and same fingerprint returns same Resume, content: {application/json: {schema: {$ref: '#/components/schemas/ResumeUploadResponse'}}}}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /resumes:
    get:
      tags: [Resumes]
      summary: Danh sách CV theo ownership
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Limit20'}
        - {name: keyword, in: query, schema: {type: string}}
        - {name: parsing_status, in: query, schema: {$ref: '#/components/schemas/ParsingStatus'}}
      responses:
        '200': {description: Resumes, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedResumesResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /resumes/{id}:
    get:
      tags: [Resumes]
      summary: Chi tiết CV
      parameters: [{$ref: '#/components/parameters/UuidId'}]
      responses:
        '200': {description: Detail, content: {application/json: {schema: {$ref: '#/components/schemas/ResumeDetailResponse'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Resumes]
      summary: Soft delete CV
      parameters: [{$ref: '#/components/parameters/UuidId'}]
      responses:
        '204': {description: Deleted}
        '404': {$ref: '#/components/responses/NotFound'}

  /resumes/{id}/status:
    get:
      tags: [Resumes]
      summary: Trạng thái parse
      parameters: [{$ref: '#/components/parameters/UuidId'}]
      responses:
        '200': {description: Status, content: {application/json: {schema: {$ref: '#/components/schemas/ResumeStatusResponse'}}}}
        '404': {$ref: '#/components/responses/NotFound'}

  /resumes/{id}/parsed-data:
    put:
      tags: [Resumes]
      summary: Human-in-the-loop cập nhật CV
      description: Direct mutation tạo input revision mới rồi invalidate Match generation/snapshots.
      parameters: [{$ref: '#/components/parameters/UuidId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResumeParsedDataUpdate'}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/ResumeDetailResponse'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /resumes/{id}/download:
    get:
      tags: [Resumes]
      summary: Tải file CV
      parameters: [{$ref: '#/components/parameters/UuidId'}]
      responses:
        '200':
          description: Binary file
          content:
            application/pdf: {}
            application/vnd.openxmlformats-officedocument.wordprocessingml.document: {}
        '404': {$ref: '#/components/responses/NotFound'}

  /jobs:
    get:
      tags: [Jobs]
      summary: Danh sách JD theo role
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Limit20'}
        - {name: keyword, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/JobStatus'}}
        - {name: parsing_status, in: query, schema: {$ref: '#/components/schemas/ParsingStatus'}}
      responses:
        '200': {description: Jobs, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedJobsResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [Jobs]
      summary: HR tạo JD mới idempotently
      description: HR only; fixed UUIDv5 namespace and SHA-256 canonical create-payload fingerprint. Same key/same fingerprint returns same JD; same key/different fingerprint returns 409 IDEMPOTENCY_KEY_REUSED. Persist trước dispatch; dispatcher lỗi được recovery xử lý khi JD còn PENDING.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JobCreateRequest'}
      responses:
        '201': {description: Persisted/created; same key and same fingerprint returns same JD, content: {application/json: {schema: {$ref: '#/components/schemas/JobResponse'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /jobs/{id}:
    get:
      tags: [Jobs]
      summary: Chi tiết JD
      parameters: [{$ref: '#/components/parameters/UuidId'}]
      responses:
        '200': {description: Job, content: {application/json: {schema: {$ref: '#/components/schemas/JobResponse'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Jobs]
      summary: Cập nhật JD
      description: raw_content đổi => revision++ trước reparse, DRAFT/PENDING, invalidate Match; dispatch failure được PENDING recovery xử lý.
      parameters: [{$ref: '#/components/parameters/UuidId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JobUpdateRequest'}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/JobResponse'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      tags: [Jobs]
      summary: Soft delete JD
      parameters: [{$ref: '#/components/parameters/UuidId'}]
      responses:
        '204': {description: Deleted}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /jobs/{id}/status:
    patch:
      tags: [Jobs]
      summary: Đổi trạng thái JD
      description: "Allowed: same-state, DRAFT->ACTIVE, ACTIVE->DRAFT|CLOSED, CLOSED->DRAFT|ACTIVE. DRAFT->CLOSED invalid."
      parameters: [{$ref: '#/components/parameters/UuidId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JobStatusRequest'}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/JobResponse'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /jobs/{id}/criteria:
    get:
      tags: [Jobs]
      summary: Lấy criteria
      parameters: [{$ref: '#/components/parameters/UuidId'}]
      responses:
        '200': {description: Criteria, content: {application/json: {schema: {$ref: '#/components/schemas/JobCriteriaResponse'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Jobs]
      summary: Cập nhật criteria
      description: Direct mutation revision++ và invalidate Match generation/snapshots.
      parameters: [{$ref: '#/components/parameters/UuidId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JobCriteriaRequest'}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/JobCriteriaResponse'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /jobs/{id}/weights:
    put:
      tags: [Jobs]
      summary: Cập nhật trọng số
      description: Direct mutation revision++ và invalidate Match; recalculate chỉ quyết định dispatch.
      parameters: [{$ref: '#/components/parameters/UuidId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WeightsRequest'}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/JobResponse'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /matching:
    get:
      tags: [Matching]
      summary: Current matching results
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Limit20'}
        - {name: job_id, in: query, schema: {type: string, format: uuid}}
        - {name: resume_id, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/MatchStatus'}}
      responses:
        '200': {description: Matches, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedMatchesResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /matching/calculate:
    post:
      tags: [Matching]
      summary: Trigger single/batch matching
      description: Validate toàn batch; atomic prepare; exclusive PENDING->PROCESSING claim và PROCESSING-only terminal CAS theo generation/revisions.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MatchCalculateRequest'}
      responses:
        '202': {description: Accepted, content: {application/json: {schema: {$ref: '#/components/schemas/MatchTriggerResponse'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /matching/{match_id}:
    get:
      tags: [Matching]
      summary: Chi tiết/current status Match
      parameters: [{$ref: '#/components/parameters/MatchUuid'}]
      responses:
        '200': {description: Match, content: {application/json: {schema: {$ref: '#/components/schemas/MatchResponse'}}}}
        '404': {$ref: '#/components/responses/NotFound'}

  /matching/{match_id}/gap-analysis:
    get:
      tags: [Matching]
      summary: Skill Gap
      parameters: [{$ref: '#/components/parameters/MatchUuid'}]
      responses:
        '200': {description: Gap, content: {application/json: {schema: {$ref: '#/components/schemas/GapAnalysisResponse'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /jobs/{id}/leaderboard:
    get:
      tags: [Matching]
      summary: Leaderboard CV thuộc kho HR
      parameters:
        - {$ref: '#/components/parameters/UuidId'}
        - {$ref: '#/components/parameters/Page'}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: min_score, in: query, schema: {type: number, minimum: 0, maximum: 100}}
      responses:
        '200': {description: Leaderboard, content: {application/json: {schema: {$ref: '#/components/schemas/LeaderboardResponse'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

components:
  securitySchemes:
    BearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}

  parameters:
    UuidId: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    MatchUuid: {name: match_id, in: path, required: true, schema: {type: string, format: uuid}}
    Page: {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
    Limit20: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID unique per logical create request. Stable UUIDv5 namespace derives resource id; same key is valid only when SHA-256 request fingerprint matches the persisted fingerprint.
      schema: {type: string, format: uuid}

  responses:
    BadRequest: {description: Bad request, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Unauthorized: {description: Unauthorized, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Forbidden: {description: Forbidden, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    NotFound: {description: Not found or hidden, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Conflict: {description: Conflict, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    IdempotencyConflict: {description: Same Idempotency-Key/deterministic resource id was reused with a different request fingerprint; error.code=IDEMPOTENCY_KEY_REUSED, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    PayloadTooLarge: {description: File too large, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    UnsupportedMediaType: {description: Unsupported media, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    ValidationError: {description: Validation/precondition error, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    ServiceUnavailable: {description: Task dispatcher unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}

  schemas:
    Role: {type: string, enum: [CANDIDATE, HR, ADMIN]}
    ParsingStatus: {type: string, enum: [PENDING, PROCESSING, PARSED, FAILED]}
    JobStatus: {type: string, enum: [DRAFT, ACTIVE, CLOSED]}
    MatchStatus: {type: string, enum: [PENDING, PROCESSING, COMPLETED, FAILED]}

    Meta:
      type: object
      required: [page, limit, total_items, total_pages]
      properties:
        page: {type: integer, minimum: 1}
        limit: {type: integer, minimum: 1}
        total_items: {type: integer, minimum: 0}
        total_pages: {type: integer, minimum: 0}

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success: {type: boolean, enum: [false]}
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
            details: {nullable: true}

    MessageResponse:
      type: object
      required: [success]
      properties:
        success: {type: boolean, enum: [true]}
        message: {type: string, nullable: true}

    RegisterRequest:
      type: object
      required: [email, password, full_name, role]
      properties:
        email: {type: string, format: email}
        password: {type: string, minLength: 8}
        full_name: {type: string, minLength: 1, maxLength: 100}
        phone_number: {type: string, nullable: true, maxLength: 20}
        role: {type: string, enum: [CANDIDATE, HR]}

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string}

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: {type: string}
        new_password: {type: string, minLength: 8}

    UserUpdateRequest:
      type: object
      minProperties: 1
      properties:
        full_name: {type: string, minLength: 1, maxLength: 100}
        phone_number: {type: string, nullable: true, maxLength: 20}

    AdminUserPatchRequest:
      type: object
      minProperties: 1
      properties:
        is_active: {type: boolean}
        role: {$ref: '#/components/schemas/Role'}

    User:
      type: object
      required: [id, email, full_name, role, is_active, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        full_name: {type: string}
        phone_number: {type: string, nullable: true}
        role: {$ref: '#/components/schemas/Role'}
        is_active: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    UserResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data: {$ref: '#/components/schemas/User'}

    PaginatedUsersResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: {type: boolean, enum: [true]}
        data: {type: array, items: {$ref: '#/components/schemas/User'}}
        meta: {$ref: '#/components/schemas/Meta'}

    LoginData:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token: {type: string}
        token_type: {type: string, example: Bearer}
        expires_in: {type: integer, example: 900}
        user: {$ref: '#/components/schemas/User'}

    LoginResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data: {$ref: '#/components/schemas/LoginData'}

    Skill:
      type: object
      required: [id, name, normalized_name, skill_kind, category]
      properties:
        id: {type: integer}
        name: {type: string}
        normalized_name: {type: string}
        skill_kind: {type: string, enum: [HARD, SOFT]}
        category: {type: string}

    PaginatedSkillsResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: {type: boolean, enum: [true]}
        data: {type: array, items: {$ref: '#/components/schemas/Skill'}}
        meta: {$ref: '#/components/schemas/Meta'}

    CandidateProfile:
      type: object
      properties:
        full_name: {type: string, nullable: true}
        email: {type: string, format: email, nullable: true}
        phone_number: {type: string, nullable: true}
        current_title: {type: string, nullable: true}
        location: {type: string, nullable: true}
        linkedin_url: {type: string, nullable: true}
        github_url: {type: string, nullable: true}
        professional_summary: {type: string, nullable: true}

    ResumeSkillInput:
      type: object
      required: [skill_id]
      properties:
        skill_id: {type: integer}
        years_of_experience: {type: number, minimum: 0, nullable: true}
        proficiency_level: {type: string, nullable: true}

    ExperienceInput:
      type: object
      required: [company_name, job_title]
      properties:
        company_name: {type: string}
        job_title: {type: string}
        start_date: {type: string, format: date, nullable: true}
        end_date: {type: string, format: date, nullable: true}
        is_current: {type: boolean, default: false}
        description: {type: string, nullable: true}

    EducationInput:
      type: object
      required: [institution_name]
      properties:
        institution_name: {type: string}
        degree: {type: string, nullable: true}
        field_of_study: {type: string, nullable: true}
        start_year: {type: integer, nullable: true}
        graduation_year: {type: integer, nullable: true}
        gpa: {type: number, nullable: true}
        description: {type: string, nullable: true}

    ResumeParsedDataUpdate:
      type: object
      required: [candidate_profile, skills, experiences, educations]
      properties:
        candidate_profile:
          nullable: true
          allOf:
            - {$ref: '#/components/schemas/CandidateProfile'}
        skills: {type: array, items: {$ref: '#/components/schemas/ResumeSkillInput'}}
        experiences: {type: array, items: {$ref: '#/components/schemas/ExperienceInput'}}
        educations: {type: array, items: {$ref: '#/components/schemas/EducationInput'}}

    ResumeSummary:
      type: object
      required: [id, revision, file_name, file_size, mime_type, parsing_status, is_manually_edited, created_at]
      properties:
        id: {type: string, format: uuid}
        revision: {type: integer, minimum: 1}
        file_name: {type: string}
        file_size: {type: integer}
        mime_type: {type: string}
        parsing_status: {$ref: '#/components/schemas/ParsingStatus'}
        is_manually_edited: {type: boolean}
        created_at: {type: string, format: date-time}
        parsed_at: {type: string, format: date-time, nullable: true}

    ResumeUploadData:
      type: object
      required: [resume_id, revision, file_name, file_size, parsing_status]
      properties:
        resume_id: {type: string, format: uuid}
        revision: {type: integer, minimum: 1}
        file_name: {type: string}
        file_size: {type: integer}
        parsing_status: {$ref: '#/components/schemas/ParsingStatus'}

    ResumeUploadResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data: {$ref: '#/components/schemas/ResumeUploadData'}

    ResumeStatusData:
      type: object
      required: [resume_id, revision, parsing_status]
      properties:
        resume_id: {type: string, format: uuid}
        revision: {type: integer, minimum: 1}
        parsing_status: {$ref: '#/components/schemas/ParsingStatus'}
        parsed_at: {type: string, format: date-time, nullable: true}
        error_message: {type: string, nullable: true}

    ResumeStatusResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data: {$ref: '#/components/schemas/ResumeStatusData'}

    ResumeDetailData:
      type: object
      required: [resume, candidate_profile, skills, experiences, educations]
      properties:
        resume: {$ref: '#/components/schemas/ResumeSummary'}
        candidate_profile:
          nullable: true
          allOf:
            - {$ref: '#/components/schemas/CandidateProfile'}
        skills: {type: array, items: {$ref: '#/components/schemas/ResumeSkillInput'}}
        experiences: {type: array, items: {$ref: '#/components/schemas/ExperienceInput'}}
        educations: {type: array, items: {$ref: '#/components/schemas/EducationInput'}}

    ResumeDetailResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data: {$ref: '#/components/schemas/ResumeDetailData'}

    PaginatedResumesResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: {type: boolean, enum: [true]}
        data: {type: array, items: {$ref: '#/components/schemas/ResumeSummary'}}
        meta: {$ref: '#/components/schemas/Meta'}

    JobCreateRequest:
      type: object
      required: [title, job_level, raw_content]
      properties:
        title: {type: string, minLength: 1}
        job_level: {type: string, minLength: 1}
        location: {type: string, nullable: true}
        raw_content: {type: string, minLength: 1}
        w_skill: {type: number, minimum: 0, maximum: 1, default: 0.5}
        w_semantic: {type: number, minimum: 0, maximum: 1, default: 0.3}
        w_experience: {type: number, minimum: 0, maximum: 1, default: 0.2}

    JobUpdateRequest:
      type: object
      minProperties: 1
      properties:
        title: {type: string}
        job_level: {type: string}
        location: {type: string, nullable: true}
        raw_content: {type: string, minLength: 1}

    JobStatusRequest:
      type: object
      required: [status]
      properties:
        status: {$ref: '#/components/schemas/JobStatus'}

    Job:
      type: object
      required: [id, recruiter_id, revision, title, job_level, parsing_status, is_criteria_verified, w_skill, w_semantic, w_experience, status, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        recruiter_id: {type: string, format: uuid}
        revision: {type: integer, minimum: 1}
        title: {type: string}
        job_level: {type: string}
        location: {type: string, nullable: true}
        raw_content: {type: string}
        min_experience_years: {type: number, minimum: 0}
        education_requirement: {type: string, nullable: true}
        parsing_status: {$ref: '#/components/schemas/ParsingStatus'}
        is_criteria_verified: {type: boolean}
        w_skill: {type: number}
        w_semantic: {type: number}
        w_experience: {type: number}
        status: {$ref: '#/components/schemas/JobStatus'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        parsed_at: {type: string, format: date-time, nullable: true}

    JobResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data: {$ref: '#/components/schemas/Job'}

    PaginatedJobsResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: {type: boolean, enum: [true]}
        data: {type: array, items: {$ref: '#/components/schemas/Job'}}
        meta: {$ref: '#/components/schemas/Meta'}

    JobSkillCriterion:
      type: object
      required: [skill_id, importance]
      properties:
        skill_id: {type: integer}
        importance: {type: string, enum: [MANDATORY, OPTIONAL]}
        min_years_required: {type: number, minimum: 0, default: 0}

    JobCriteriaRequest:
      type: object
      required: [skills]
      properties:
        min_experience_years: {type: number, minimum: 0}
        education_requirement: {type: string, nullable: true}
        skills:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/JobSkillCriterion'}

    JobCriteriaData:
      type: object
      required: [job_id, revision, is_criteria_verified, skills]
      properties:
        job_id: {type: string, format: uuid}
        revision: {type: integer, minimum: 1}
        min_experience_years: {type: number}
        education_requirement: {type: string, nullable: true}
        is_criteria_verified: {type: boolean}
        skills: {type: array, items: {$ref: '#/components/schemas/JobSkillCriterion'}}

    JobCriteriaResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data: {$ref: '#/components/schemas/JobCriteriaData'}

    WeightsRequest:
      type: object
      required: [w_skill, w_semantic, w_experience]
      properties:
        w_skill: {type: number, minimum: 0, maximum: 1}
        w_semantic: {type: number, minimum: 0, maximum: 1}
        w_experience: {type: number, minimum: 0, maximum: 1}
        recalculate: {type: boolean, default: false}

    MatchCalculateRequest:
      type: object
      required: [job_id, resume_ids]
      properties:
        job_id: {type: string, format: uuid}
        resume_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, format: uuid}

    MatchTriggerData:
      type: object
      required: [job_id, match_ids, total_matches, status]
      properties:
        job_id: {type: string, format: uuid}
        match_ids: {type: array, items: {type: string, format: uuid}}
        total_matches: {type: integer, minimum: 1}
        status: {type: string, enum: [PENDING]}

    MatchTriggerResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data: {$ref: '#/components/schemas/MatchTriggerData'}

    MatchSummary:
      type: object
      required: [id, job_id, resume_id, generation, resume_revision, job_revision, status, algorithm_version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        job_id: {type: string, format: uuid}
        resume_id: {type: string, format: uuid}
        generation: {type: integer, minimum: 1}
        resume_revision: {type: integer, minimum: 1}
        job_revision: {type: integer, minimum: 1}
        status: {$ref: '#/components/schemas/MatchStatus'}
        overall_score: {type: number, minimum: 0, maximum: 100, nullable: true}
        skill_score: {type: number, minimum: 0, maximum: 100, nullable: true}
        semantic_score: {type: number, minimum: 0, maximum: 100, nullable: true}
        experience_score: {type: number, minimum: 0, maximum: 100, nullable: true}
        algorithm_version: {type: string}
        embedding_model: {type: string, nullable: true}
        embedding_preprocessing_version: {type: string, nullable: true}
        error_message: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        calculated_at: {type: string, format: date-time, nullable: true}

    PaginatedMatchesResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: {type: boolean, enum: [true]}
        data: {type: array, items: {$ref: '#/components/schemas/MatchSummary'}}
        meta: {$ref: '#/components/schemas/Meta'}

    SkillEvidence:
      type: object
      additionalProperties: true
      properties:
        skill_id: {type: integer}
        name: {type: string}
        importance: {type: string, nullable: true}
        criticality: {type: string, nullable: true}
        gap_type: {type: string, nullable: true}

    MatchDetail:
      allOf:
        - {$ref: '#/components/schemas/MatchSummary'}
        - type: object
          properties:
            matched_skills: {type: array, items: {$ref: '#/components/schemas/SkillEvidence'}}
            missing_skills: {type: array, items: {$ref: '#/components/schemas/SkillEvidence'}}
            gap_analysis_summary: {type: string, nullable: true}

    MatchResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data: {$ref: '#/components/schemas/MatchDetail'}

    GapAnalysisData:
      type: object
      required: [match_id, overall_score, matched_skills, missing_skills]
      properties:
        match_id: {type: string, format: uuid}
        overall_score: {type: number}
        skill_score: {type: number}
        semantic_score: {type: number}
        experience_score: {type: number}
        matched_skills: {type: array, items: {$ref: '#/components/schemas/SkillEvidence'}}
        missing_skills: {type: array, items: {$ref: '#/components/schemas/SkillEvidence'}}
        recommendation: {type: string, nullable: true}
        explanation: {type: string, nullable: true}

    GapAnalysisResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, enum: [true]}
        data: {$ref: '#/components/schemas/GapAnalysisData'}

    CandidateSummary:
      type: object
      properties:
        resume_id: {type: string, format: uuid}
        full_name: {type: string, nullable: true}
        current_title: {type: string, nullable: true}

    LeaderboardItem:
      type: object
      required: [rank, match, candidate]
      properties:
        rank: {type: integer, minimum: 1}
        match: {$ref: '#/components/schemas/MatchSummary'}
        candidate: {$ref: '#/components/schemas/CandidateSummary'}

    LeaderboardResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: {type: boolean, enum: [true]}
        data: {type: array, items: {$ref: '#/components/schemas/LeaderboardItem'}}
        meta: {$ref: '#/components/schemas/Meta'}
