[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "webcv-backend"
version = "0.1.0"
description = "Backend foundation for WebCVUngVienTuyenDung"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118,<1.0",
    "uvicorn[standard]>=0.37,<1.0",
    "SQLAlchemy[asyncio]>=2.0.44,<3.0",
    "asyncpg>=0.30,<1.0",
    "pgvector>=0.4.1,<1.0",
    "pydantic-settings>=2.11,<3.0",
    "email-validator>=2.2,<3.0",
    "PyJWT>=2.10,<3.0",
    "pwdlib[argon2]>=0.2.1,<1.0",
    "python-multipart>=0.0.20,<1.0",
    "pypdf>=6.1,<7.0",
    "python-docx>=1.2,<2.0",
]

[project.optional-dependencies]
ai = [
    "sentence-transformers>=3.3,<6.0",
]
queue = [
    "celery[redis]>=5.5,<6.0",
]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.4,<9.0",
    "pytest-asyncio>=1.2,<2.0",
    "ruff>=0.13,<1.0",
    "mypy>=1.18,<2.0",
    "reportlab>=4.4,<5.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
exclude = ["tests"]

